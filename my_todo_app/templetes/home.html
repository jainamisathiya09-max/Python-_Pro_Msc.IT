<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f4f7;
    }

    .container {
        width: 80%;
        margin: 50px auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
    }

    .form-box {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-bottom: 30px;
    }

    input,
    select {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }

    input[type="text"] {
        width: 30%;
    }

    input[type="date"] {
        width: 20%;
    }

    select {
        width: 20%;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th {
        background-color: #007bff;
        color: white;
        padding: 12px;
    }

    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    tr:hover {
        background-color: #f5f5f5;
    }

    .pending {
        color: orange;
        font-weight: bold;
    }

    .completed {
        color: green;
        font-weight: bold;
    }

    .not-started {
        color: red;
        font-weight: bold;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>Todo App</h1>

    <!-- Add Task Form -->
    <form method="POST" action="/add_task">

        <div class="form-box">

            <!-- Task Name -->
            <input type="text"
                   name="task_name"
                   placeholder="Enter Task Name"
                   required>

            <!-- Task Date -->
            <input type="date"
                   name="task_date"
                   required>

            <!-- Status Dropdown -->
            <select name="status" required>
                <option value="">Select Status</option>
                <option value="Not Started">Not Started</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>

            <!-- Add Button -->
            <button type="submit">Add Task</button>

        </div>

    </form>


    <!-- Task Table -->

    <table>

        <thead>
            <tr>
                <th>Task Name</th>
                <th>Task Date</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

            {% for task in tasks %}

            <tr>

                <td>{{ task.task_name }}</td>

                <td>{{ task.task_date }}</td>

                <td>
                    {% if task.status == "Completed" %}
                        <span class="completed">
                            {{ task.status }}
                        </span>

                    {% elif task.status == "Pending" %}
                        <span class="pending">
                            {{ task.status }}
                        </span>

                    {% else %}
                        <span class="not-started">
                            {{ task.status }}
                        </span>
                    {% endif %}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>
```

</body>
</html>
